<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Напоминание</title>
  <script src="shared/theme-init.js"></script>
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="reminder.css">
</head>
<body>
  <div class="reminder-card">
    <div class="rm-eyebrow">
      <span class="rm-badge" data-i18n="reminder.badge">ПОРА</span>
      <span class="rm-time" id="rmTime"></span>
    </div>
    <div class="rm-title" id="rmTitle"></div>
    <div class="rm-body" id="rmBody" hidden></div>
    <div class="rm-link-row" id="rmLinkRow" hidden>
      <button class="link-chip" id="rmLinkBtn" type="button" data-i18n-title="reminder.linkTitle" title="Открыть ссылку в браузере"></button>
    </div>
    <div class="rm-actions">
      <button class="pixel-btn" id="btnDone" type="button" data-i18n="reminder.done">СДЕЛАНО</button>
      <button class="pixel-btn ghost" id="btnSnooze" type="button" data-i18n="reminder.snooze">+10 МИН</button>
    </div>
  </div>
  <script src="shared/i18n.js"></script>
  <script src="reminder.js"></script>
</body>
</html>
